<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>M4A to FLAC Converter</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      text-align: center;
    }
    .drop-zone {
      border: 2px dashed #ccc;
      padding: 40px;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    #status {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>M4A → FLAC 変換ツール</h1>
  
  <div class="drop-zone" id="dropZone">
    M4Aファイルをここにドロップ（またはクリックして選択）
    <input type="file" id="fileInput" accept=".m4a" style="display: none;">
  </div>

  <button id="convertBtn" disabled>FLACに変換する</button>

  <p id="status"></p>
  <div id="downloadArea"></div>

  <!-- FFmpeg.wasm (v0.11.x 安定版) の読み込み -->
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>

  <script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    let ffmpeg = null;
    let selectedFile = null;

    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const convertBtn = document.getElementById('convertBtn');
    const status = document.getElementById('status');
    const downloadArea = document.getElementById('downloadArea');

    // ファイル選択のイベント
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

    function handleFile(file) {
      if (file && (file.name.endsWith('.m4a') || file.type.includes('audio'))) {
        selectedFile = file;
        status.innerText = `選択されたファイル: ${file.name}`;
        convertBtn.disabled = false;
      } else {
        alert('M4Aファイルを選択してください');
      }
    }

    // 変換処理
    convertBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      status.innerText = 'FFmpegエンジンを読み込み中...';
      convertBtn.disabled = true;

      try {
        if (!ffmpeg) {
          ffmpeg = createFFmpeg({ log: true });
          await ffmpeg.load();
        }

        status.innerText = '変換中...（しばらくお待ちください）';

        // ブラウザ上の仮想ファイルシステムに書き込み
        ffmpeg.FS('writeFile', 'input.m4a', await fetchFile(selectedFile));

        // FFmpegコマンドの実行 (M4A -> FLAC)
        await ffmpeg.run('-i', 'input.m4a', 'output.flac');

        // 変換結果の読み込み
        const data = ffmpeg.FS('readFile', 'output.flac');

        // ダウンロードリンクの作成
        const blob = new Blob([data.buffer], { type: 'audio/flac' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = selectedFile.name.replace(/\.[^/.]+$/, "") + '.flac';
        a.innerText = 'FLACファイルをダウンロード';
        a.style.display = 'inline-block';
        a.style.marginTop = '15px';
        a.style.padding = '10px 15px';
        a.style.backgroundColor = '#4CAF50';
        a.style.color = 'white';
        a.style.textDecoration = 'none';
        a.style.borderRadius = '5px';
        
        downloadArea.innerHTML = '';
        downloadArea.appendChild(a);
        status.innerText = '変換完了！';
      } catch (err) {
        console.error(err);
        status.innerText = 'エラーが発生しました。コンソールをご確認ください。';
        convertBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
